<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

      
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

       
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }

        
        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #1e293b;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
        }

        .grafico-container {
            grid-column: span 2;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }

        canvas {
            background: white;
            border-radius: 10px;
            width: 100% !important;
            height: 400px !important;
        }
    </style>
</head>

<body>

<h1>📊 Dashboard</h1>
<a href="/">⬅ Voltar</a>
<hr>

<div class="container">


    <div class="card">
        <h3>Total de Vendas</h3>
        <p id="total">...</p>
    </div>

    <div class="card">
        <h3>Faturamento</h3>
        <p id="faturamento">...</p>
    </div>

    <div>
        <h2>🏆 Top 5 Vendedores</h2>
        <ul id="lista_vendedores"></ul>
    </div>

 
    <div>
        <h2>🔥 Top 5 Produtos</h2>
        <ul id="lista_produtos"></ul>
    </div>


    <div class="grafico-container">
        <h2>📈 Vendas por Produto</h2>
        <canvas id="grafico"></canvas>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let chart;

function carregarDados() {
    fetch('/api/dashboard/')
        .then(res => res.json())
        .then(data => {

         
            document.getElementById('total').innerText =
                data.total_vendas;

            document.getElementById('faturamento').innerText =
                "R$ " + data.faturamento_total;

            const listaVendedores = document.getElementById('lista_vendedores');
            listaVendedores.innerHTML = '';

            data.top_vendedores.forEach((v, index) => {
                listaVendedores.innerHTML +=
                    `<li> ${index + 1} - ${v.vendedor__nome} (${v.total} vendas)</li>`;
            });

            const listaProdutos = document.getElementById('lista_produtos');
            listaProdutos.innerHTML = '';

            data.top_produtos.forEach((p, index) => {
                listaProdutos.innerHTML +=
                    `<li> ${index + 1} - ${p.produto__nome} (${p.total} vendidos)</li>`;
            });

            const labels = data.vendas_por_produto.map(d => d.produto__nome);
            const valores = data.vendas_por_produto.map(d => d.total);

            if (chart) {
                chart.data.labels = labels;
                chart.data.datasets[0].data = valores;
                chart.update();
            } else {
                chart = new Chart(document.getElementById('grafico'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Vendas por Produto',
                            data: valores
                        }]
                    },
                    options: {
                       

                        responsive: true,
                        maintainAspectRatio: false,

                        plugins: {
                            legend: {
                                display: false
                            }
                        },

                        scales: {
                            x: {
                                beginAtZero: true
                            },
                            y: {
                                ticks: {
                                    autoSkip: false 
                                }
                            }
                        }
                    }
                });
            }
        });
}

setInterval(carregarDados, 3000);
carregarDados();
</script>

</body>
</html>
