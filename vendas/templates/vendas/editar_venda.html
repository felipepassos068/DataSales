{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Venda</title>
    <link rel="shortcut icon" href="{% static 'img/financa-light.png' %}" type="image/png" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="{% static 'img/financa-dark.png' %}" type="image/png" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="{% static 'css/cabeca.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/form.css' %}" type="text/css">
</head>
<body>
    <main class="principal">
    <header>
        <a href="/home/"><img class="Logo_D" src="{% static 'img/letra-d.png' %}" alt="Logo DataSales" width="40px"></a>
        <h1>DataSales</h1>
        <div class="modo">
            <img class="sol" src="{% static 'img/sun.png' %}" alt="sol" width="18px" height="18px">
            <input type="checkbox" name="mode" id="mode">
            <label for="mode" class="switch"></label>
            <img class="lua" src="{% static 'img/lua-crescente.png' %}" alt="lua" width="18px" height="18px">
        </div>
    </header>
    <h1 class="titulo">Editar Venda</h1>
    <main class="forms">
    <form method="post">
        {% csrf_token %}
        <article class="box">
            <label class="texto">Produto</label>
            <select list="produtos" name="produto" required>
                {% for produto in produtos %}
                <option value="{{ produto.id }}" {% if produto.id == venda.produto.id %}selected{% endif %}>
                {{ produto.nome }}
                </option>
                {% endfor %}
            </select>
        </article>
        <article class="box">
            <label class="texto">Vendedor</label>
            <select name="vendedor" required>
                {% for vendedor in vendedores %}
                <option value="{{ vendedor.id }}" {% if vendedor.id == venda.vendedor.id %}selected{% endif %}>
                {{ vendedor.nome }}
                </option>
                {% endfor %}
            </select>
        </article>
        <article class="box">
            <label class="texto">Quantidade</label>
            <input type="number" name="quantidade"  min="1" max="99999" required>
        </article>

        <button type="submit">Salvar</button>
        </form>  
    </main>
    <aside>
        <a class="back" href="/consultar/vendas/">Voltar</a>
    </aside>
    <footer>
        <p>&copy DataSales - Desenvolvido por <a class="github" href="https://github.com/felipepassos068" target="_blank">Felipe Passos</a> e <a class="github" href="https://github.com/Rhayron-w" target="_blank">Wdson Rhayron</a></p>
    </footer>
    </main>
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
